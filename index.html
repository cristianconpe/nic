<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASL Avatar — Procedural Sign Language Avatar</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0d'/%3E%3Ccircle cx='16' cy='11' r='6.5' fill='%23f3f3f1'/%3E%3Cpath d='M9 27c0-6 3-9 7-9s7 3 7 9' fill='%23f3f3f1'/%3E%3Ccircle cx='23' cy='19' r='3.4' fill='%23e3ab84'/%3E%3C/svg%3E"
    />

  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div id="brand">
          <span class="dot"></span>
          <div>
            <h1>ASL Avatar</h1>
            <p>Procedural signing avatar &middot; Three.js</p>
          </div>
        </div>

        <div id="letter-info">
          <div id="letter-big">A</div>
          <div id="letter-desc">Fist with thumb resting alongside the fingers.</div>
        </div>
      </div>

      <div id="text-panel">
        <div id="text-panel-row">
          <input
            id="text-input"
            type="text"
            placeholder="Escribe una palabra… (ej. HI)"
            maxlength="60"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="btn-play" class="text-btn primary" title="Reproducir" aria-label="Reproducir">▶</button>
          <button id="btn-mic" class="text-btn" title="Dictado por voz" aria-label="Dictado por voz">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M19 11a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9 21h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="btn-clear" class="text-btn" title="Borrar" aria-label="Borrar">✕</button>
        </div>
        <div id="text-panel-footer">
          <label id="speed-control">
            <span>Velocidad</span>
            <select id="speed-select">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </label>
        </div>
        <div id="text-chips"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
